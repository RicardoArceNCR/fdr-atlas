<div class="diptico" id="diptico-container">
  <div class="diptico__mapa">
    <div class="mapa-editorial">
      <img id="mapa-base" class="mapa-base" src="" alt="Mapa base">

      <div id="svg-overlay-container" class="mapa-svg-layer"></div>
    </div>
    <div id="insets-container"></div>
    <div id="escala-text" class="diptico__escala"></div>

    <div class="diptico__leyenda-mapa">
      <div class="diptico__leyenda-mapa-titulo">Concesiones Mineras</div>
      <div id="leyenda-lista"></div>
    </div>
  </div>
  <div class="diptico__info">
    <div class="diptico__header">
      <div class="diptico__kicker" id="region-text"></div>
      <h1 class="diptico__titulo" id="titulo-text"></h1>
      <p class="diptico__subtitulo" id="pueblos-text"></p>
    </div>

    <div class="diptico__stats">
      <div class="stat">
        <div class="stat__valor" id="stat-ha-territorio"></div>
        <div class="stat__label">Ha. del territorio</div>
      </div>
      <div class="stat">
        <div class="stat__valor" id="stat-concesiones"></div>
        <div class="stat__label">Concesiones</div>
      </div>
      <div class="stat">
        <div class="stat__valor" id="stat-ha-concesiones"></div>
        <div class="stat__label">Ha. concesionadas</div>
      </div>
    </div>

    <div class="diptico__narrativa" id="descripcion-text"></div>

    <div class="diptico__concesiones">
      <div class="diptico__seccion-titulo">Detalle de concesiones</div>
      <div class="concesiones-lista" id="concesiones-lista"></div>
    </div>

    <div class="diptico__fuente" id="fuente-text"></div>
  </div>
</div>
